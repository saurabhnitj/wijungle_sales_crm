spring.application.name=wijungle-sales-crm
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/wijunglecrm;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:local-demo-secret-change-this-key-please-12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@local.test}
app.bootstrap.admin-password=${ADMIN_PASSWORD:ChangeMe123!}
